<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Analyzer</title>
<style>
  :root {
    --bg: #0a0b10; --card: #111827; --elevated: #1a1e2e; --input: #0d1117;
    --cyan: #06b6d4; --green: #22c55e; --yellow: #eab308;
    --orange: #f97316; --red: #ef4444; --purple: #a855f7; --blue: #3b82f6;
    --text: #f1f5f9; --body: #94a3b8; --muted: #64748b;
    --border: rgba(255,255,255,0.08);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Segoe UI',Inter,system-ui,sans-serif; background:var(--bg); color:var(--text); line-height:1.4; overflow-x:hidden; }
  html, body { height:100%; }

  /* Top bar */
  .topbar {
    position:sticky; top:0; z-index:100; background:rgba(10,11,16,0.95); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border); padding:8px 16px;
    display:flex; align-items:center; gap:10px;
  }
  .topbar input {
    flex:1; background:var(--input); border:1px solid var(--border); border-radius:8px;
    padding:8px 14px; color:var(--text); font-size:13px; outline:none; min-width:0;
  }
  .topbar input:focus { border-color:var(--cyan); }
  .topbar input::placeholder { color:var(--muted); }
  .topbar .btn {
    padding:8px 20px; border:none; border-radius:8px;
    background:linear-gradient(135deg,var(--cyan),var(--blue));
    color:#fff; font-weight:700; font-size:13px; cursor:pointer; white-space:nowrap;
  }
  .topbar .btn:disabled { opacity:0.5; cursor:not-allowed; }
  .topbar .status { font-size:11px; color:var(--muted); white-space:nowrap; }
  .topbar .status.error { color:var(--red); }
  .topbar .status.success { color:var(--green); }
  .topbar .status.loading { color:var(--cyan); }
  .refresh-info { font-size:10px; color:var(--muted); display:flex; align-items:center; gap:4px; }
  .refresh-info .dot { width:6px; height:6px; border-radius:50%; background:var(--green); animation:pulse 2s infinite; }
  .refresh-info .dot.paused { background:var(--muted); animation:none; }
  .refresh-info button {
    background:none; border:1px solid var(--border); border-radius:4px;
    color:var(--muted); font-size:10px; padding:1px 6px; cursor:pointer;
  }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
  .spin { display:inline-block; animation:spin 1s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg);} }

  /* Dashboard */
  #dashboard { display:none; height:calc(100vh - 50px); }
  #dashboard.show { display:grid; }
  .dash-grid {
    display:grid; grid-template-columns:1fr 380px; grid-template-rows:auto 1fr;
    height:100%; overflow:hidden;
  }
  @media(max-width:900px) { .dash-grid { grid-template-columns:1fr; grid-template-rows:auto auto 1fr; } }

  /* Info strip */
  .info-strip {
    grid-column:1/-1; display:flex; align-items:center; gap:8px;
    padding:8px 16px; border-bottom:1px solid var(--border);
    background:var(--card); overflow-x:auto; flex-wrap:nowrap;
  }
  .info-strip .coin-id { display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .info-strip .coin-id img { width:28px; height:28px; border-radius:50%; }
  .info-strip .coin-name { font-size:16px; font-weight:700; }
  .info-strip .chain { font-size:10px; padding:1px 6px; border-radius:3px; background:rgba(168,85,247,0.15); color:var(--purple); font-weight:600; text-transform:uppercase; }
  .info-strip .price-big { font-size:18px; font-weight:700; margin-left:auto; flex-shrink:0; }
  .info-strip .chg { font-size:13px; font-weight:600; flex-shrink:0; }

  .stat-pill {
    display:flex; align-items:center; gap:4px; padding:4px 10px;
    background:var(--elevated); border-radius:6px; font-size:11px; flex-shrink:0;
  }
  .stat-pill .sv { font-weight:700; color:var(--text); }
  .stat-pill .sl { color:var(--muted); }

  /* Left: chart */
  .chart-area { border-right:1px solid var(--border); overflow:hidden; min-height:300px; }
  .chart-area iframe { width:100%; height:100%; border:none; }
  @media(max-width:900px) { .chart-area { grid-column:1/-1; min-height:350px; border-right:none; border-bottom:1px solid var(--border); } }

  /* Right: analysis panel */
  .panel { overflow-y:auto; padding:10px 14px; display:flex; flex-direction:column; gap:10px; }
  @media(max-width:900px) { .panel { grid-column:1/-1; } }

  /* Verdict card */
  .verdict-card {
    text-align:center; padding:14px; border-radius:10px;
    border:1px solid var(--border); background:var(--card); position:relative;
  }
  .verdict-card .v-icon { font-size:32px; }
  .verdict-card .v-text { font-size:22px; font-weight:800; margin:2px 0; }
  .verdict-card .v-sub { font-size:11px; color:var(--body); }

  /* Zone strip */
  .zone-strip {
    display:flex; align-items:center; gap:8px; padding:10px 12px;
    border-radius:10px; border:1px solid var(--border);
  }
  .zone-strip .z-icon { font-size:24px; flex-shrink:0; }
  .zone-strip .z-info { flex:1; min-width:0; }
  .zone-strip .z-title { font-size:13px; font-weight:700; }
  .zone-strip .z-desc { font-size:10px; color:var(--body); line-height:1.3; }
  .zone-strip .z-signals { display:flex; gap:4px; flex-wrap:wrap; margin-top:4px; }
  .zone-strip .z-sig {
    font-size:9px; padding:1px 6px; border-radius:4px; font-weight:600;
  }
  .zone-meter { display:flex; gap:2px; height:4px; border-radius:2px; overflow:hidden; margin-top:6px; }
  .zone-meter div { flex:1; border-radius:2px; }

  /* Score rings row */
  .score-row { display:flex; justify-content:space-around; padding:6px 0; }
  .score-item { text-align:center; }
  .score-ring { width:56px; height:56px; position:relative; }
  .score-ring svg { transform:rotate(-90deg); }
  .score-ring circle { fill:none; stroke-width:5; }
  .score-ring .bg { stroke:var(--elevated); }
  .score-ring .fg { stroke-linecap:round; }
  .score-val { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; }
  .score-label { font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; margin-top:2px; }

  /* Breakdown bars */
  .bd-list { display:flex; flex-direction:column; gap:4px; }
  .bd-row {
    display:flex; align-items:center; gap:6px; padding:4px 8px;
    background:var(--elevated); border-radius:6px; border-left:3px solid var(--muted);
    font-size:11px;
  }
  .bd-row .bl { flex:1; color:var(--body); }
  .bd-row .bw { width:60px; height:4px; background:var(--card); border-radius:2px; overflow:hidden; }
  .bd-row .bf { height:100%; border-radius:2px; }
  .bd-row .bv { min-width:24px; text-align:right; font-weight:600; }

  /* Notable criteria compact */
  .notable-bar {
    padding:8px 10px; border-radius:10px; border:1px solid var(--border);
  }
  .notable-bar .nb-head { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
  .notable-bar .nb-grade { font-size:13px; font-weight:800; }
  .notable-bar .nb-pass { font-size:11px; color:var(--body); }
  .crit-grid { display:grid; grid-template-columns:1fr 1fr; gap:3px; }
  .crit-item {
    display:flex; align-items:center; gap:4px; font-size:10px; padding:2px 6px;
    border-radius:4px; background:rgba(255,255,255,0.02);
  }
  .crit-item.pass { color:var(--green); }
  .crit-item.fail { color:var(--red); opacity:0.7; }

  /* Red flags compact */
  .rf-list { display:flex; flex-direction:column; gap:3px; }
  .rf-item {
    font-size:10px; padding:4px 8px; border-radius:6px;
    background:rgba(239,68,68,0.08); border:1px solid rgba(239,68,68,0.15);
    color:var(--body); line-height:1.3;
  }

  /* Welcome */
  .welcome {
    display:flex; align-items:center; justify-content:center;
    height:calc(100vh - 50px); text-align:center; color:var(--muted);
  }
  .welcome h2 { font-size:20px; font-weight:600; color:var(--body); margin-bottom:6px; }
  .welcome p { font-size:13px; }
</style>
</head>
<body>

<!-- Hidden fields -->
<div style="display:none">
  <input id="tokenName"><input id="marketCap" type="number"><input id="liquidity" type="number">
  <input id="volume24h" type="number"><input id="tokenAge" type="number"><input id="holders" type="number">
  <input id="top10Pct" type="number"><input id="priceChange" type="number"><input id="txns">
  <input id="priceUsd"><input id="aiScore" type="number"><input id="bundledBuys" type="number">
  <input id="totalCapital" type="number" value="1000"><input id="invested" type="number" value="0">
  <input id="tokenAmount" type="number" value="0"><input id="currentValue">
  <div class="check-item checked" data-key="mintRevoked"></div>
  <div class="check-item checked" data-key="freezeRevoked"></div>
  <div class="check-item checked" data-key="lpBurned"></div>
  <div class="check-item checked" data-key="noHoneypot"></div>
  <div class="check-item checked" data-key="noHiddenMint"></div>
  <div class="check-item checked" data-key="top10Under30"></div>
  <div class="check-item checked" data-key="noSingleHolder10"></div>
  <div class="check-item checked" data-key="contractVerified"></div>
  <div class="check-item checked" data-key="hasTwitter"></div>
  <div class="check-item checked" data-key="hasTelegram"></div>
  <div class="check-item checked" data-key="hasWebsite"></div>
  <div class="check-item is-red" data-key="whaleSelling"></div>
  <div class="check-item is-red" data-key="devSelling"></div>
  <div id="stageGroup"><button class="toggle-btn active" data-val="considering"></button></div>
</div>

<!-- Top bar -->
<div class="topbar">
  <input type="text" id="dexUrl" placeholder="Dán link DexScreener hoặc token address...">
  <button class="btn" id="fetchBtn" onclick="fetchAndAnalyze()">⚡ Phân tích</button>
  <span class="status" id="fetchStatus"></span>
  <div class="refresh-info" id="refreshInfo" style="display:none">
    <span class="dot" id="rDot"></span>
    <span id="lastRefreshInfo">5s</span>
    <button onclick="toggleAutoRefresh()" id="autoRefreshToggle">⏸</button>
  </div>
</div>

<!-- Welcome screen -->
<div class="welcome" id="welcomeScreen">
  <div>
    <h2>Coin Analyzer</h2>
    <p>Dán link DexScreener vào thanh trên rồi bấm Phân tích</p>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard">
  <div class="dash-grid">
    <!-- Info strip -->
    <div class="info-strip" id="infoStrip"></div>

    <!-- Left: Chart -->
    <div class="chart-area" id="chartArea">
      <iframe id="dexChart" allowfullscreen></iframe>
    </div>

    <!-- Right: Analysis panel -->
    <div class="panel" id="panel">
      <div class="verdict-card" id="verdictCard">
        <div class="v-icon" id="vIcon"></div>
        <div class="v-text" id="vText"></div>
        <div class="v-sub" id="vSub"></div>
      </div>

      <div class="zone-strip" id="zoneStrip"></div>

      <div class="score-row">
        <div class="score-item"><div class="score-ring"><svg width="56" height="56"><circle class="bg" cx="28" cy="28" r="23"/><circle class="fg" id="ringTotal" cx="28" cy="28" r="23" stroke-dasharray="144.5" stroke-dashoffset="144.5"/></svg><div class="score-val" id="valTotal">0</div></div><div class="score-label">Tổng</div></div>
        <div class="score-item"><div class="score-ring"><svg width="56" height="56"><circle class="bg" cx="28" cy="28" r="23"/><circle class="fg" id="ringSafety" cx="28" cy="28" r="23" stroke-dasharray="144.5" stroke-dashoffset="144.5"/></svg><div class="score-val" id="valSafety">0</div></div><div class="score-label">An toàn</div></div>
        <div class="score-item"><div class="score-ring"><svg width="56" height="56"><circle class="bg" cx="28" cy="28" r="23"/><circle class="fg" id="ringSignal" cx="28" cy="28" r="23" stroke-dasharray="144.5" stroke-dashoffset="144.5"/></svg><div class="score-val" id="valSignal">0</div></div><div class="score-label">Tín hiệu</div></div>
        <div class="score-item"><div class="score-ring"><svg width="56" height="56"><circle class="bg" cx="28" cy="28" r="23"/><circle class="fg" id="ringRisk" cx="28" cy="28" r="23" stroke-dasharray="144.5" stroke-dashoffset="144.5"/></svg><div class="score-val" id="valRisk">0</div></div><div class="score-label">Rủi ro</div></div>
      </div>

      <div class="bd-list" id="breakdownList"></div>

      <div class="notable-bar" id="notableBar"></div>

      <div class="rf-list" id="redFlagList"></div>
    </div>
  </div>
</div>

<script>
var fetchedData = null;
var multiTF = { priceM5:null, priceH1:null, priceH6:null, priceH24:null, volM5:null, volH1:null, volH6:null, buys24:0, sells24:0, buysH1:0, sellsH1:0 };
var autoRefreshTimer = null, autoRefreshEnabled = true, AUTO_REFRESH_INTERVAL = 3000;
var isFirstRender = true;
var SIGNAL_ORIGIN = 'https://metropio.trading';
var SUPABASE_URL = '';
var SUPABASE_KEY = '';
var activeSignal = null; // signal data for current token

function corsProxy(url) {
  return 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url);
}
function extractSupabaseConfig() {
  return fetch(corsProxy(SIGNAL_ORIGIN + '/'))
    .then(function(r) { return r.ok ? r.text() : Promise.reject('fail'); })
    .then(function(html) {
      var m = html.match(/src="(\/assets\/index-[^"]+\.js)"/);
      if (!m) return Promise.reject('no bundle');
      return fetch(corsProxy(SIGNAL_ORIGIN + m[1])).then(function(r) { return r.ok ? r.text() : Promise.reject('fail'); });
    })
    .then(function(js) {
      var urlMatch = js.match(/https:\/\/[a-z0-9]+\.supabase\.co/);
      var keyMatch = js.match(/eyJhbGci[A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+/);
      if (!urlMatch || !keyMatch) return Promise.reject('no config');
      SUPABASE_URL = urlMatch[0] + '/rest/v1';
      SUPABASE_KEY = keyMatch[0];
    });
}
function fetchActiveSignal(tokenAddress) {
  if (!SUPABASE_URL || !tokenAddress) return Promise.resolve(null);
  return fetch(SUPABASE_URL + '/signal_history?token_address=eq.' + tokenAddress + '&order=detected_at.desc&limit=1&select=status,exit_signal,bullish_probability,composite_score,detected_at', {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Accept-Profile': 'public' }
  })
  .then(function(res) { return res.ok ? res.json() : []; })
  .then(function(data) { return data.length > 0 ? data[0] : null; })
  .catch(function() { return null; });
}
// Init Supabase config on page load
extractSupabaseConfig().catch(function() { console.log('Config failed'); });

function getVal(id) { var el = document.getElementById(id); return el ? (parseFloat(el.value)||0) : 0; }
function isChecked(key) { var el = document.querySelector('.check-item[data-key="'+key+'"]'); return el ? el.classList.contains('checked') : false; }
function getStage() { return 'considering'; }
function setField(id, val) { var el = document.getElementById(id); if(el && val !== undefined && val !== null) el.value = val; }
function setStatus(msg, type) { var el = document.getElementById('fetchStatus'); el.className='status '+type; el.innerHTML=msg; }
function autoCheck(key) { var el = document.querySelector('.check-item[data-key="'+key+'"]'); if(el && !el.classList.contains('checked')) el.classList.add('checked'); }
function autoUncheck(key) { var el = document.querySelector('.check-item[data-key="'+key+'"]'); if(el && el.classList.contains('checked')) el.classList.remove('checked'); }
function fmtNum(n) { if(n>=1e9) return '$'+(n/1e9).toFixed(1)+'B'; if(n>=1e6) return '$'+(n/1e6).toFixed(1)+'M'; if(n>=1e3) return '$'+(n/1e3).toFixed(1)+'K'; return '$'+n.toFixed(0); }
function scoreColor(s) { return s>=75?'var(--green)':s>=50?'var(--yellow)':s>=30?'var(--orange)':'var(--red)'; }

var CIRC = 144.5;
function setRing(id, valId, score) {
  var off = CIRC - (CIRC * Math.min(score,100)/100);
  var el = document.getElementById(id), v = document.getElementById(valId);
  if(!el||!v) return;
  el.style.stroke = scoreColor(score); el.style.strokeDashoffset = off;
  v.textContent = Math.round(score); v.style.color = scoreColor(score);
}

/* ===== DEXSCREENER ===== */
function parseDexUrl(input) {
  input = input.trim();
  var m = input.match(/dexscreener\.com\/([^\/]+)\/([^\/?#]+)/);
  if (m) return { type:'pair', chain:m[1], address:m[2] };
  if (/^[a-zA-Z0-9]{20,}$/.test(input)) return { type:'token', address:input };
  return null;
}
function extractPair(data) {
  if (data.pair) return data.pair;
  if (data.pairs && data.pairs.length > 0) {
    return data.pairs.sort(function(a,b){
      return ((b.liquidity&&b.liquidity.usd)||0) - ((a.liquidity&&a.liquidity.usd)||0);
    })[0];
  }
  return null;
}

function fillFromPair(p) {
  var name = (p.baseToken&&p.baseToken.symbol)||'';
  var fullName = (p.baseToken&&p.baseToken.name)||'';
  setField('tokenName', name + (fullName ? ' ('+fullName+')' : ''));
  if (p.fdv) setField('marketCap', Math.round(p.fdv));
  else if (p.marketCap) setField('marketCap', Math.round(p.marketCap));
  if (p.liquidity && typeof p.liquidity.usd==='number') setField('liquidity', Math.round(p.liquidity.usd));
  if (p.volume && p.volume.h24) setField('volume24h', Math.round(p.volume.h24));
  if (p.priceChange && p.priceChange.h24!==undefined) setField('priceChange', p.priceChange.h24);
  if (p.priceChange) {
    multiTF.priceM5=p.priceChange.m5!==undefined?p.priceChange.m5:null;
    multiTF.priceH1=p.priceChange.h1!==undefined?p.priceChange.h1:null;
    multiTF.priceH6=p.priceChange.h6!==undefined?p.priceChange.h6:null;
    multiTF.priceH24=p.priceChange.h24!==undefined?p.priceChange.h24:null;
  }
  if (p.volume) { multiTF.volM5=p.volume.m5!==undefined?p.volume.m5:null; multiTF.volH1=p.volume.h1!==undefined?p.volume.h1:null; multiTF.volH6=p.volume.h6!==undefined?p.volume.h6:null; }
  if (p.pairCreatedAt) setField('tokenAge', Math.round((Date.now()-p.pairCreatedAt)/60000));
  if (p.priceUsd) setField('priceUsd', p.priceUsd);
  if (p.txns && p.txns.h24) {
    setField('txns', (p.txns.h24.buys||0)+' mua / '+(p.txns.h24.sells||0)+' bán');
    multiTF.buys24=p.txns.h24.buys||0; multiTF.sells24=p.txns.h24.sells||0;
  }
  var rS=0,rB=0;
  if(p.txns&&p.txns.h1){rB=p.txns.h1.buys||0;rS=p.txns.h1.sells||0;multiTF.buysH1=rB;multiTF.sellsH1=rS;}
  if(rS>0&&rB>0&&(rS/rB)>3) autoCheck('whaleSelling');
  autoUncheck('hasTwitter'); autoUncheck('hasTelegram'); autoUncheck('hasWebsite');
  if(p.info&&p.info.socials) for(var i=0;i<p.info.socials.length;i++){var s=p.info.socials[i]; if(s.type==='twitter')autoCheck('hasTwitter'); if(s.type==='telegram')autoCheck('hasTelegram');}
  if(p.info&&p.info.websites&&p.info.websites.length>0) autoCheck('hasWebsite');
  autoUncheck('whaleSelling'); autoUncheck('devSelling');
  var isPF=(p.dexId==='pumpfun'||p.dexId==='pumpswap');
  if(isPF){autoUncheck('contractVerified');autoUncheck('top10Under30');autoUncheck('noSingleHolder10');}
}

/* ===== ANALYZE (logic giữ nguyên, render mới) ===== */
function analyze() {
  var d = {
    name: document.getElementById('tokenName').value||'TOKEN',
    mcap:getVal('marketCap'), liq:getVal('liquidity'), vol:getVal('volume24h'),
    age:getVal('tokenAge'), holders:getVal('holders'), top10:getVal('top10Pct'),
    priceChg:getVal('priceChange'), aiScore:getVal('aiScore'), bundled:getVal('bundledBuys'),
    capital:getVal('totalCapital'), invested:getVal('invested'), tokenAmount:getVal('tokenAmount'),
    priceUsd:parseFloat(document.getElementById('priceUsd').value)||0, stage:getStage(),
    mintRevoked:isChecked('mintRevoked'), freezeRevoked:isChecked('freezeRevoked'),
    lpBurned:isChecked('lpBurned'), noHoneypot:isChecked('noHoneypot'), noHiddenMint:isChecked('noHiddenMint'),
    top10Under30:isChecked('top10Under30'), noSingleHolder10:isChecked('noSingleHolder10'), contractVerified:isChecked('contractVerified'),
    hasTwitter:isChecked('hasTwitter'), hasTelegram:isChecked('hasTelegram'), hasWebsite:isChecked('hasWebsite'),
    whaleSelling:isChecked('whaleSelling'), devSelling:isChecked('devSelling')
  };

  var volH1=multiTF.volH1, volH6=multiTF.volH6, volM5=multiTF.volM5;
  if(volH1!==null&&d.vol>0){var h1E=volH1*24; if(h1E/d.vol<0.2) d.vol=Math.round(h1E);}
  else if(volH6!==null&&d.vol>0){var h6E=volH6*4; if(h6E<d.vol*0.2) d.vol=Math.round(h6E);}

  var recentVolDead=(volH1!==null&&volH1<500)||(volM5!==null&&volM5<10);
  var liqThin=d.liq>0&&d.liq<15000;
  var isLikelyDead=(d.priceChg<-80)||(d.mcap>0&&d.mcap<5000&&d.liq<3000)||(recentVolDead&&liqThin&&d.priceChg<-10);
  var isDyingMomentum=recentVolDead&&!isLikelyDead;

  if(d.tokenAmount>0&&d.priceUsd>0) d.curVal=d.tokenAmount*d.priceUsd; else d.curVal=0;

  var redFlags=[], breakdown=[];

  // 1. Security
  var criticalChecks=[d.mintRevoked,d.freezeRevoked,d.lpBurned];
  var standardChecks=[d.noHoneypot,d.noHiddenMint,d.top10Under30,d.noSingleHolder10,d.contractVerified];

  }

  // ===== SIGNAL OVERRIDE =====
  if (activeSignal && activeSignal.status === 'TRACKING' && activeSignal.exit_signal) {
    var msig = activeSignal.exit_signal;
    if (msig === 'BUY') { zone='entry';zIcon='🟢';zColor='var(--green)';zBg='rgba(34,197,94,0.12)';zTitle='BUY';zDesc='Signal: BUY — probability '+((activeSignal.bullish_probability||0))+'%'; }
    else if (msig === 'HOLD') { zone='hold';zIcon='⚡';zColor='var(--cyan)';zBg='rgba(6,182,212,0.12)';zTitle='HOLD';zDesc='Signal: HOLD — đang theo dõi'; }
    else if (msig === 'RESEARCH') { zone='caution';zIcon='🔍';zColor='var(--purple)';zBg='rgba(168,85,247,0.12)';zTitle='RESEARCH';zDesc='Đang nghiên cứu token này'; }
    else if (msig === 'TAKE_PROFIT') { zone='take-profit';zIcon='💰';zColor='var(--orange)';zBg='rgba(249,115,22,0.12)';zTitle='TAKE PROFIT';zDesc='Khuyến nghị chốt lời'; }
    else if (msig === 'STOP_LOSS') { zone='danger';zIcon='🔴';zColor='var(--red)';zBg='rgba(239,68,68,0.12)';zTitle='STOP LOSS';zDesc='Signal: cắt lỗ'; }
    zSigs=[{t:'SIGNAL:'+msig,c:zColor,b:zBg}];
    if (activeSignal.bullish_probability) zSigs.push({t:activeSignal.bullish_probability+'% prob',c:'var(--cyan)',b:'rgba(6,182,212,0.12)'});
  }

  // ===== RENDER =====
  document.getElementById('welcomeScreen').style.display='none';
  document.getElementById('dashboard').classList.add('show');

  // Info strip
  var is=document.getElementById('infoStrip');
  var p=fetchedData;
  var imgUrl=p&&p.info&&p.info.imageUrl?'<img src="'+p.info.imageUrl+'" style="width:28px;height:28px;border-radius:50%">':'';
  var chain=p&&p.chainId?'<span class="chain">'+p.chainId+'</span>':'';
  var prC=d.priceChg>=0?'var(--green)':'var(--red)';
  var ageStr=d.age<60?d.age+'m':d.age<1440?(d.age/60).toFixed(1)+'h':(d.age/1440).toFixed(0)+'d';

  is.innerHTML='<div class="coin-id">'+imgUrl+'<span class="coin-name">'+d.name+'</span>'+chain+'</div>'
    +'<span class="price-big">$'+(d.priceUsd||'?')+'</span>'
    +'<span class="chg" style="color:'+prC+'">'+(d.priceChg>=0?'+':'')+d.priceChg.toFixed(1)+'%</span>'
    +'<span class="stat-pill"><span class="sv">'+fmtNum(d.mcap)+'</span><span class="sl">MCap</span></span>'
    +'<span class="stat-pill"><span class="sv">'+fmtNum(d.liq)+'</span><span class="sl">Liq</span></span>'
    +'<span class="stat-pill"><span class="sv">'+fmtNum(d.vol)+'</span><span class="sl">Vol</span></span>'
    +'<span class="stat-pill"><span class="sv">'+ageStr+'</span><span class="sl">Age</span></span>';

  // Verdict
  document.getElementById('vIcon').textContent=vIcon;
  document.getElementById('vText').textContent=verdict;
  document.getElementById('vText').style.color=vColor;
  document.getElementById('vSub').textContent=vSub;

  // Zone
  var zs=document.getElementById('zoneStrip');
  zs.style.background=zBg;
  var zH='<div class="z-icon">'+zIcon+'</div><div class="z-info"><div class="z-title" style="color:'+zColor+'">'+zTitle+'</div><div class="z-desc">'+zDesc+'</div><div class="z-signals">';
  for(var i=0;i<zSigs.length;i++) zH+='<span class="z-sig" style="color:'+zSigs[i].c+';background:'+zSigs[i].b+'">'+zSigs[i].t+'</span>';
  zH+='</div>';
  var mz=['entry','hold','take-profit','caution','danger'],mc=['var(--green)','var(--cyan)','var(--orange)','var(--yellow)','var(--red)'];
  zH+='<div class="zone-meter">';
  for(var i=0;i<mz.length;i++){var act=mz[i]===zone;zH+='<div style="background:'+(act?mc[i]:'var(--elevated)')+'"></div>';}
  zH+='</div></div>';
  zs.innerHTML=zH;

  // Rings
  setRing('ringTotal','valTotal',totalScore);
  setRing('ringSafety','valSafety',safetyScore);
  setRing('ringSignal','valSignal',signalScore);
  setRing('ringRisk','valRisk',riskScore);

  // Breakdown
  var bl=document.getElementById('breakdownList'),bH='';
  for(var i=0;i<breakdown.length;i++){var b=breakdown[i];
    bH+='<div class="bd-row" style="border-left-color:'+b.color+'"><span class="bl">'+b.label+'</span><div class="bw"><div class="bf" style="width:'+b.score+'%;background:'+b.color+'"></div></div><span class="bv" style="color:'+b.color+'">'+Math.round(b.score)+'</span></div>';
  }
  bl.innerHTML=bH;

  // Notable
  var nb=document.getElementById('notableBar');
  var gc={S:'var(--green)',A:'var(--cyan)',B:'var(--yellow)',C:'var(--red)'};
  var nH='<div class="nb-head"><span class="nb-grade" style="color:'+gc[nGrade]+'">'+nGrade+' Grade</span><span class="nb-pass">'+np+'/10 tiêu chí</span></div>';
  nH+='<div class="crit-grid">';
  for(var i=0;i<checks.length;i++){var c=checks[i];
    nH+='<div class="crit-item '+(c.p?'pass':'fail')+'">'+(c.p?'✅':'❌')+' '+c.l+' <b>'+c.v+'</b></div>';
  }
  nH+='</div>';
  nb.innerHTML=nH;

  // Red flags
  var rf=document.getElementById('redFlagList'),rH='';
  for(var i=0;i<redFlags.length;i++) rH+='<div class="rf-item">🚩 '+redFlags[i]+'</div>';
  rf.innerHTML=rH;

  isFirstRender=false;
}

/* ===== FETCH AND ANALYZE ===== */
function fetchAndAnalyze() {
  var input=document.getElementById('dexUrl').value;
  if(!input.trim()){setStatus('Dán link DexScreener','error');return;}
  var parsed=parseDexUrl(input);
  if(!parsed){setStatus('Link không hợp lệ','error');return;}
  var btn=document.getElementById('fetchBtn');
  btn.disabled=true; btn.textContent='⟳';
  setStatus('<span class="spin">⟳</span>','loading');

  function onResult(pair){
    if(!pair){setStatus('Không tìm thấy','error');btn.disabled=false;btn.textContent='⚡ Phân tích';return;}
    fetchedData=pair; fillFromPair(pair);
    // Fetch signal cho token này trước khi analyze
    var tokenAddr = pair.baseToken && pair.baseToken.address;
    fetchActiveSignal(tokenAddr).then(function(sig) {
      activeSignal = sig;
      analyze(); loadChart(pair); startAutoRefresh();
      btn.disabled=false; btn.textContent='⚡ Phân tích';
      setStatus('✅ '+new Date().toLocaleTimeString(),'success');
    });
  }

  if(parsed.type==='pair'){
    var pU='https://api.dexscreener.com/latest/dex/pairs/'+parsed.chain+'/'+parsed.address;
    var tU='https://api.dexscreener.com/latest/dex/tokens/'+parsed.address;
    fetch(pU).then(function(r){return r.ok?r.json():null;}).then(function(data){
      var pair=data?extractPair(data):null;
      if(pair)onResult(pair); else return fetch(tU).then(function(r){return r.ok?r.json():null;}).then(function(d2){onResult(d2?extractPair(d2):null);});
    }).catch(function(){fetch(tU).then(function(r){return r.ok?r.json():null;}).then(function(d2){onResult(d2?extractPair(d2):null);}).catch(function(){setStatus('Lỗi','error');btn.disabled=false;btn.textContent='⚡ Phân tích';});});
  }else{
    fetch('https://api.dexscreener.com/latest/dex/tokens/'+parsed.address)
      .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
      .then(function(data){onResult(extractPair(data));})
      .catch(function(){setStatus('Lỗi','error');btn.disabled=false;btn.textContent='⚡ Phân tích';});
  }
}

function loadChart(pair){
  var iframe=document.getElementById('dexChart');
  if(!pair)return;
  var ch=pair.chainId||'solana', pa=pair.pairAddress||(pair.baseToken&&pair.baseToken.address)||'';
  if(pa) iframe.src='https://dexscreener.com/'+ch+'/'+pa+'?embed=1&theme=dark&trades=0&info=0';
}

/* ===== AUTO REFRESH ===== */
function startAutoRefresh(){
  stopAutoRefresh(); autoRefreshEnabled=true;
  document.getElementById('refreshInfo').style.display='flex';
  document.getElementById('rDot').classList.remove('paused');
  document.getElementById('autoRefreshToggle').textContent='⏸';
  autoRefreshTimer=setInterval(function(){if(autoRefreshEnabled)silentRefresh();},AUTO_REFRESH_INTERVAL);
}
function stopAutoRefresh(){if(autoRefreshTimer){clearInterval(autoRefreshTimer);autoRefreshTimer=null;}autoRefreshEnabled=false;}
function toggleAutoRefresh(){
  if(autoRefreshEnabled){stopAutoRefresh();document.getElementById('autoRefreshToggle').textContent='▶';document.getElementById('rDot').classList.add('paused');}
  else{startAutoRefresh();}
}
function silentRefresh(){
  var input=document.getElementById('dexUrl').value;if(!input.trim())return;
  var parsed=parseDexUrl(input);if(!parsed)return;
  function onR(pair){if(!pair)return;fetchedData=pair;fillFromPair(pair);
    var tokenAddr=pair.baseToken&&pair.baseToken.address;
    fetchActiveSignal(tokenAddr).then(function(sig){activeSignal=sig;analyze();
      document.getElementById('lastRefreshInfo').textContent=new Date().toLocaleTimeString();
    });
  }
  if(parsed.type==='pair'){
    var pU='https://api.dexscreener.com/latest/dex/pairs/'+parsed.chain+'/'+parsed.address;
    var tU='https://api.dexscreener.com/latest/dex/tokens/'+parsed.address;
    fetch(pU).then(function(r){return r.ok?r.json():null;}).then(function(data){
      var pair=data?extractPair(data):null;
      if(pair)onR(pair);else return fetch(tU).then(function(r){return r.ok?r.json():null;}).then(function(d2){onR(d2?extractPair(d2):null);});
    }).catch(function(){});
  }else{
    fetch('https://api.dexscreener.com/latest/dex/tokens/'+parsed.address)
      .then(function(r){return r.ok?r.json():null;}).then(function(data){if(data)onR(extractPair(data));}).catch(function(){});
  }
}

document.getElementById('dexUrl').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();fetchAndAnalyze();}});

// URL param auto-load
(function(){
  var params=new URLSearchParams(window.location.search);
  var url=params.get('url');
  if(url){document.getElementById('dexUrl').value=url;setTimeout(fetchAndAnalyze,100);}
})();
</script>
